<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BotFarmHQ — Sign in</title>
<style>body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f6f7f9;color:#111;font-size:18px;line-height:1.6}.wrap{max-width:520px;margin:0 auto;padding:40px 22px}input{width:100%;padding:13px;border:1px solid #d8dbdf;border-radius:12px;font-size:16px;margin:6px 0 14px}button{background:#13284a;color:#fff;border:0;padding:15px 22px;border-radius:99px;font-size:17px;font-weight:700;cursor:pointer}</style></head><body><div class="wrap">
<h1>Sign in — BotFarmHQ</h1><p><strong>Demo sign-in.</strong> This works in your browser only, for now. Enter your email and you will go to the admin page. No password is checked here, and no real account is created on a server yet. Do not use a real password on this page.</p>
<form id="f"><label>Email <input id="email" type="email" placeholder="you@yourbusiness.com" required></label><button type="submit">Continue to admin</button></form>
<p><a href="signup.html">Need an account? Sign up</a> · <a href="index.html">Back to landing page</a></p>
<script>document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var em=document.getElementById('email').value.trim();if(!em)return;try{localStorage.setItem('botfarmhq_user',em);}catch(err){}window.location.href='admin.html';});</script>
</div></body></html>
